name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Put the game inside the app
        run: |
          W=android/app/src/main/assets/www
          mkdir -p "$W"
          cp index.html privacy.html "$W"/
          cp -r icons "$W"/

      - name: Bundle the fonts so the app looks right offline
        continue-on-error: true
        run: python3 android/bundle_fonts.py android/app/src/main/assets/www

      - name: Load the signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then gradle --no-daemon assembleDebug bundleRelease; else gradle --no-daemon assembleDebug; fi

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/inside-jokes-test.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab out/inside-jokes-play-store.aab; fi
          ls -la out

      - name: Publish to the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build -y --cleanup-tag || true
          gh release create latest-build out/* --prerelease --title "Latest build (#${{ github.run_number }})" \
            --notes "inside-jokes-test.apk: tap it on your Android phone to install and test. inside-jokes-play-store.aab: upload this to Google Play Console (only appears once the signing key secrets are added)."
